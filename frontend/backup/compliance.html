<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><title>Compliance Checker — IP-SAKTI</title>  
<style id="ip-sakti-inline-theme">
/* =========================================================
   IP-SAKTI SAHAYAK — ORIGINAL AYURVEDIC VISUAL THEME
   Based on the uploaded original prototype.
   Do not replace this palette with the newer cool/green theme.
   ========================================================= */

:root{
  --ink:#2B2523;
  --dark:#2B2523;
  --dark-deep:#1E1A18;
  --cream:#F5F2EC;
  --warm-white:#FFFDF8;
  --warm-panel:#EFEAE1;
  --rust:#9E4624;
  --rust-dark:#8B3A1B;
  --gold:#C58529;
  --gold-bright:#D49A37;
  --green:#4A6B5D;
  --green-dark:#2D4A3E;
  --green-soft:#86A895;
  --line:rgba(197,133,41,.30);
  --muted:rgba(43,37,35,.62);
}

/* ---------- GLOBAL BACKGROUND ---------- */
html,body{
  min-height:100%;
}

body{
  margin:0;
  font-family:'Plus Jakarta Sans',Arial,sans-serif;
  color:var(--ink);
  background-color:var(--cream);
  background-image:
    radial-gradient(var(--rust) .75px,transparent .75px),
    radial-gradient(var(--rust) .75px,var(--cream) .75px);
  background-size:30px 30px;
  background-position:0 0,15px 15px;
}

/* ---------- NAVIGATION ---------- */
.nav{
  min-height:72px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:26px;
  padding:14px 4%;
  background:var(--dark)!important;
  color:var(--cream)!important;
  border-bottom:2px solid var(--gold)!important;
  box-shadow:0 4px 14px rgba(43,37,35,.18);
  position:sticky;
  top:0;
  z-index:50;
}

.nav a{
  color:var(--cream)!important;
  text-decoration:none;
  font-weight:600;
  transition:.2s;
}

.nav a:hover{
  color:var(--gold-bright)!important;
}

.nav .brand{
  margin-right:auto;
  color:var(--cream)!important;
  font-family:'Cinzel',Georgia,serif;
  font-weight:700;
  letter-spacing:.05em;
}

.nav .brand small{
  display:block;
  margin-top:3px;
  color:var(--gold-bright)!important;
  font-family:'Plus Jakarta Sans',Arial,sans-serif;
  font-size:10px;
  font-weight:500;
  letter-spacing:0;
}

/* ---------- PAGE ---------- */
.page{
  width:min(1180px,92%);
  margin:0 auto;
  padding:42px 0 50px;
}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(rgba(255,253,248,.90),rgba(255,253,248,.90)),
    radial-gradient(var(--rust) .75px,transparent .75px);
  background-size:auto,30px 30px;
  border:2px solid rgba(158,70,36,.20);
  border-radius:18px;
  padding:42px;
  margin-bottom:24px;
  box-shadow:0 4px 20px rgba(43,37,35,.06);
}

.hero:after{
  content:"𑁍";
  position:absolute;
  right:28px;
  bottom:-45px;
  font-family:Georgia,serif;
  font-size:150px;
  color:var(--gold);
  opacity:.08;
  pointer-events:none;
}

.hero .pill{
  position:relative;
  z-index:1;
}

.hero h1{
  position:relative;
  z-index:1;
  margin:14px 0 10px;
  color:var(--rust-dark);
  font-family:'Cinzel',Georgia,serif;
  font-size:42px;
  line-height:1.15;
}

.hero p{
  position:relative;
  z-index:1;
  max-width:820px;
  color:rgba(43,37,35,.68);
  font-size:16px;
  line-height:1.7;
}

/* ---------- PILLS ---------- */
.pill{
  display:inline-flex;
  align-items:center;
  width:max-content;
  background:rgba(197,133,41,.12)!important;
  color:var(--rust-dark)!important;
  border:1px solid rgba(197,133,41,.42)!important;
  border-radius:999px;
  padding:6px 11px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.10em;
}

/* ---------- FORMS ---------- */
.form{
  background:var(--warm-white);
  border:2px solid rgba(158,70,36,.20);
  border-radius:18px;
  padding:28px;
  box-shadow:0 4px 20px rgba(43,37,35,.06);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  margin-bottom:4px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--green-dark);
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
}

input,textarea,select{
  width:100%;
  box-sizing:border-box;
  border:1px solid rgba(197,133,41,.45);
  border-radius:10px;
  background:var(--warm-white);
  color:var(--ink);
  padding:12px 14px;
  font:inherit;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--rust);
  box-shadow:0 0 0 3px rgba(158,70,36,.10);
}

textarea{
  resize:vertical;
}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--gold);
  border-radius:9px;
  background:var(--rust);
  color:white;
  padding:11px 17px;
  font:inherit;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  transition:.18s;
}

.btn:hover{
  background:var(--rust-dark);
  transform:translateY(-1px);
}

.btn.secondary{
  background:var(--warm-white);
  color:var(--green-dark);
  border-color:rgba(74,107,93,.35);
}

.btn.secondary:hover{
  background:rgba(74,107,93,.10);
}

/* ---------- CARDS / RESULTS ---------- */
.result{
  display:none;
  margin-top:24px;
}

.card{
  background:var(--warm-white)!important;
  color:var(--ink);
  border:1px solid rgba(197,133,41,.40)!important;
  border-radius:14px;
  padding:22px;
  box-shadow:inset 0 0 12px rgba(197,133,41,.04),
             0 4px 20px rgba(43,37,35,.05);
}

.card h2{
  color:var(--rust-dark);
  font-family:'Cinzel',Georgia,serif;
  margin-top:0;
}

.metric{
  margin-top:12px;
  color:var(--rust-dark);
  font-family:'Cinzel',Georgia,serif;
  font-size:25px;
  font-weight:700;
}

.muted{
  color:rgba(43,37,35,.64)!important;
  line-height:1.65;
}

.steps{
  display:grid;
  gap:9px;
  margin-top:12px;
}

.steps br{
  display:none;
}

.steps{
  white-space:pre-line;
}

.steps::first-line{
  color:var(--green-dark);
}

.steps{
  color:var(--ink);
}

.steps > *{
  padding:10px 12px;
}

/* ---------- HERB LIBRARY ---------- */
.herb-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.herb-card{
  overflow:hidden;
}

.herb-image{
  height:150px;
  margin:-22px -22px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(74,107,93,.16),rgba(43,37,35,.08)),
    var(--warm-panel);
  font-size:64px;
  border-bottom:1px solid rgba(197,133,41,.30);
}

.herb-card h2{
  margin-bottom:6px;
}

.herb-card .btn{
  margin-top:8px;
}

/* ---------- FOOTER ---------- */
.footer{
  margin-top:25px;
  padding:18px 0;
  color:rgba(43,37,35,.52);
  border-top:1px solid rgba(197,133,41,.28);
  font-size:11px;
  text-align:center;
}

/* ---------- WARM ACCENT HELPERS ---------- */
.warm-panel{
  background:var(--warm-panel);
  border:1px solid rgba(197,133,41,.30);
}

.green-panel{
  background:rgba(74,107,93,.10);
  border:1px solid rgba(74,107,93,.30);
}

.rust-text{
  color:var(--rust-dark)!important;
}

.gold-text{
  color:var(--gold-bright)!important;
}

/* ---------- MOBILE ---------- */
@media(max-width:800px){
  .nav{
    flex-wrap:wrap;
    gap:12px 18px;
    padding:12px 5%;
  }

  .nav .brand{
    flex-basis:100%;
  }

  .page{
    width:94%;
    padding-top:24px;
  }

  .hero{
    padding:28px 22px;
  }

  .hero h1{
    font-size:32px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .herb-grid{
    grid-template-columns:1fr;
  }
}

</head><body><nav class="nav"><div class="brand">IP-SAKTI SAHAYAK</div><a href="/">🏠 Home</a><a class="" href="/patentability">⚖️ Patentability</a><a class="active" href="/compliance">📋 Compliance</a><a class="" href="/herbs">🌿 Herb Library</a><a href="/assistant">🤖 AI Sahayak</a></nav><main class="page"><section class="hero"><div style="color:#D49A37;font-size:12px;font-weight:700;letter-spacing:.18em">REGULATORY WORKSPACE</div><h1>Compliance Checker</h1><p>Build a preliminary compliance pathway for an Ayurvedic or traditional-medicine product. The result is generated from the same ML + RAG backend used by AI Sahayak.</p></section><section class="card"><div class="form-grid"><div class="field"><label>Product category</label><select id="product"><option>Ayurvedic medicine</option><option>Classical formulation</option><option>New / modified formulation</option><option>Botanical product</option></select></div><div class="field"><label>Biological resource involved?</label><select id="bio"><option>Yes</option><option>No</option><option>Not sure</option></select></div><div class="field"><label>Traditional knowledge involved?</label><select id="tk"><option>Yes</option><option>No</option><option>Not sure</option></select></div><div class="field"><label>Manufacturing in India?</label><select id="mfg"><option>Yes</option><option>No</option><option>Not sure</option></select></div><div class="field full"><label>Describe your compliance question</label><textarea id="q" rows="4" placeholder="Example: What licence and GMP requirements apply to a new Ayurvedic formulation?"></textarea></div></div><div style="margin-top:16px"><button class="btn" onclick="runCheck()">Build Compliance Pathway</button> <a class="btn secondary" href="/assistant">Ask AI Sahayak</a></div></section><section id="result" class="result"></section></main><script>async function runCheck(){const q=document.getElementById('q').value.trim()||`What AYUSH licensing, GMP and compliance requirements apply to a ${document.getElementById('product').value}? Biological resource: ${document.getElementById('bio').value}. Traditional knowledge: ${document.getElementById('tk').value}. Manufacturing in India: ${document.getElementById('mfg').value}.`;const box=document.getElementById('result');box.innerHTML='<div class="card">⏳ Building compliance pathway...</div>';try{const r=await fetch('/api/v1/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,persona:'innovator',language:'en'})});const d=await r.json();const steps=(d.compliance_roadmap||[]).map(x=>`<li><b>${x.title}</b> — ${x.status}</li>`).join('');box.innerHTML=`<div class="card"><span class="pill">${d.ml_category}</span><div class="metric">${Number(d.ml_confidence||0).toFixed(2)}%</div><div class="muted">ML confidence · ${d.ml_confidence_level}</div><hr style="border:0;border-top:1px solid #C5852933;margin:18px 0"><h2>Guidance</h2><p>${escapeHtml(d.answer||'')}</p><h3>Compliance pathway</h3><ol class="list">${steps||'<li>Review the retrieved regulatory sources and product-specific requirements.</li>'}</ol><div class="status">Requirements depend on the exact product, claims, manufacturing setup and applicable law. Verify with the relevant authority.</div></div>`}catch(e){box.innerHTML=`<div class="card">Could not connect to backend: ${escapeHtml(e.message)}</div>`}}function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}</script></body></html>
